# Run separately per model file; only compare quantizations of the same base revision.
name: quantization-single-model
model: ${LIOL_MODEL}
binary: ${LIOL_LLAMA_BENCH}
prompt_tokens: [128, 512]
generation_tokens: [64]
threads: [6]
gpu_layers: [-1]
batch_sizes: [512]
ubatch_sizes: [128]
repetitions: 5
