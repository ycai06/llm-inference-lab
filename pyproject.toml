[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-inference-lab"
version = "0.1.0"
description = "Reproducible local llama.cpp inference microbenchmarks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PyYAML>=6.0.2,<7", "psutil>=7,<9", "matplotlib>=3.10,<4"]

[project.scripts]
liol = "backend.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6,<7", "types-psutil>=7,<8"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build]
exclude = ["/.cache", "/.venv", "/data/results", "/dist", "/build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend"]
